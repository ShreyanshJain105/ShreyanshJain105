<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="325" viewBox="0 0 1200 325"><title>Featured GitHub repositories and open-source forks</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111c32"/></linearGradient><linearGradient id="ac"><stop stop-color="#54d6ff"/><stop offset="1" stop-color="#9b8cff"/></linearGradient></defs><rect x="1" y="1" width="1198" height="323" rx="18" fill="url(#bg)" stroke="#263750"/><circle cx="1172" cy="27" r="5" fill="#54d6ff"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle><text x="30" y="44" font-family="monospace" font-size="14" font-weight="700" fill="#7ddcff">SELECTED BUILDS / OPEN-SOURCE REPOSITORIES</text><a href="https://github.com/ShreyanshJain105/cravebite-frontend" target="_blank"><rect x="30" y="72" width="355" height="94" rx="13" fill="#111f34" stroke="#2d4562"/><text x="47" y="99" font-family="Arial" font-size="19" font-weight="700" fill="#f4f7fb">CraveBite</text><text x="47" y="121" font-family="Arial" font-size="11" fill="#b5c4d8">Food ordering app • frontend + backend</text><text x="47" y="141" font-family="monospace" font-size="10" fill="#71d7ff">JavaScript</text><text x="47" y="157" font-family="monospace" font-size="9" fill="#9b8cff">PROJECT ↗</text></a><a href="https://github.com/ShreyanshJain105/JobTrek-UI" target="_blank"><rect x="415" y="72" width="355" height="94" rx="13" fill="#111f34" stroke="#2d4562"/><text x="432" y="99" font-family="Arial" font-size="19" font-weight="700" fill="#f4f7fb">JobTrek</text><text x="432" y="121" font-family="Arial" font-size="11" fill="#b5c4d8">Job portal • React UI + Spring Boot API</text><text x="432" y="141" font-family="monospace" font-size="10" fill="#71d7ff">TypeScript</text><text x="432" y="157" font-family="monospace" font-size="9" fill="#9b8cff">PROJECT ↗</text></a><a href="https://github.com/ShreyanshJain105/rea" target="_blank"><rect x="800" y="72" width="355" height="94" rx="13" fill="#111f34" stroke="#2d4562"/><text x="817" y="99" font-family="Arial" font-size="19" font-weight="700" fill="#f4f7fb">rea</text><text x="817" y="121" font-family="Arial" font-size="11" fill="#b5c4d8">Agent-based reverse engineering • fork</text><text x="817" y="141" font-family="monospace" font-size="10" fill="#71d7ff">TypeScript</text><text x="817" y="157" font-family="monospace" font-size="9" fill="#9b8cff">FORKED REPOSITORY ↗</text></a><a href="https://github.com/ShreyanshJain105/coolify" target="_blank"><rect x="30" y="184" width="355" height="94" rx="13" fill="#111f34" stroke="#2d4562"/><text x="47" y="211" font-family="Arial" font-size="19" font-weight="700" fill="#f4f7fb">coolify</text><text x="47" y="233" font-family="Arial" font-size="11" fill="#b5c4d8">Self-hostable PaaS • fork</text><text x="47" y="253" font-family="monospace" font-size="10" fill="#71d7ff">Project</text><text x="47" y="269" font-family="monospace" font-size="9" fill="#9b8cff">FORKED REPOSITORY ↗</text></a><a href="https://github.com/ShreyanshJain105/ruflo" target="_blank"><rect x="415" y="184" width="355" height="94" rx="13" fill="#111f34" stroke="#2d4562"/><text x="432" y="211" font-family="Arial" font-size="19" font-weight="700" fill="#f4f7fb">ruflo</text><text x="432" y="233" font-family="Arial" font-size="11" fill="#b5c4d8">Claude multi-agent orchestration • fork</text><text x="432" y="253" font-family="monospace" font-size="10" fill="#71d7ff">Project</text><text x="432" y="269" font-family="monospace" font-size="9" fill="#9b8cff">FORKED REPOSITORY ↗</text></a><text x="30" y="310" font-family="monospace" font-size="10" font-weight="400" fill="#8296b0">Forks are labelled transparently; original project ownership is not implied.</text></svg>